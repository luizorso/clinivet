<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title th:text="${titulo}"></title>
     <!-- CSS das páginas Cadastrar -->
     <link rel="stylesheet" th:href="@{/styleForm.css}">
     <!-- Css da Navbar -->
     <link rel="stylesheet" th:href="@{/navbar.css}">
</head>
<body>
    <!-- Importação do menu Navbar -->
    <div th:replace="~{fragments/navbar :: menu}"></div>
    <div class="main-container">
     

        <form th:action="@{/clientes/salvar}" th:object="${clienteDTO}" method="post">
               <h3 th:text="${titulo}"></h3>
               <input type="hidden" th:field="*{idCliente}">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" th:field="*{nome}" required />
            </div>

            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" th:field="*{cpf}" required />
            </div>

            <div class="form-group">
                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" 
                        th:value="${clienteDTO.dataNascimento != null ? 
                        #temporals.format(clienteDTO.dataNascimento, 'yyyy-MM-dd') : ''}" 
                        name="dataNascimento" required />
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" th:field="*{email}" required />
            </div>

            <div class="form-group">
                <label for="observacao">Observação:</label>
                <textarea id="observacao" th:field="*{observacoesGerais}"></textarea>
            </div>

            <button type="submit" th:text="${clienteDTO.idCliente != null ? 'Atualizar' : 'Salvar'}"></button>
            <a th:href="@{/clientes}"  style="display: block; width: 100%; 
                        text-align: center; 
                        padding: 12px; margin-top: 10px; background-color: #6c757d; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 1rem; box-sizing: border-box;">Cancelar</a>
           
        </form>
    </div>
</body>
</html>
