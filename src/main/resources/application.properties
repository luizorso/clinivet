spring.application.name=clinivet

# Configuração do MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/clinivet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desativa o warning do Open Session in View (Open-In-View)
spring.jpa.open-in-view=false

# Configuração do Thymeleaf
spring.thymeleaf.cache=false

